<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Temperature Converter</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --error-color: #e74c3c;
            --text-color: #2c3e50;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .converter-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .btn-convert {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-convert:hover {
            background-color: #357abd;
        }

        .results-section {
            margin-top: 28px;
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
        }

        .results-section h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .result-box {
            background-color: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .result-box .unit-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 4px;
            display: block;
        }

        .result-box .value {
            font-size: 1.25rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="converter-card">
        <h1>Temperature Converter</h1>
        
        <!-- Input Value -->
        <div class="form-group">
            <label for="tempInput">Degrees</label>
            <input type="text" id="tempInput" placeholder="Enter a number (e.g., 25, -40)" autocomplete="off">
            <div id="errorMessage" class="error-message"></div>
        </div>

        <!-- Source Unit -->
        <div class="form-group">
            <label for="unitSelect">Type</label>
            <select id="unitSelect">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>
        </div>

        <button class="btn-convert" id="convertBtn">Convert</button>

        <!-- Output Results -->
        <div class="results-section">
            <h2>Converted Output</h2>
            <div class="result-grid">
                <div class="result-box">
                    <span class="unit-label">Celsius</span>
                    <span class="value" id="outCelsius">--</span>
                </div>
                <div class="result-box">
                    <span class="unit-label">Fahrenheit</span>
                    <span class="value" id="outFahrenheit">--</span>
                </div>
                <div class="result-box">
                    <span class="unit-label">Kelvin</span>
                    <span class="value" id="outKelvin">--</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tempInput = document.getElementById('tempInput');
            const unitSelect = document.getElementById('unitSelect');
            const convertBtn = document.getElementById('convertBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            const outCelsius = document.getElementById('outCelsius');
            const outFahrenheit = document.getElementById('outFahrenheit');
            const outKelvin = document.getElementById('outKelvin');

            // Absolute zero thresholds
            const ABSOLUTE_ZERO = {
                C: -273.15,
                F: -459.67,
                K: 0
            };

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.style.display = 'block';
            }

            function clearError() {
                errorMessage.textContent = '';
                errorMessage.style.display = 'none';
            }

            function clearOutputs() {
                outCelsius.textContent = '--';
                outFahrenheit.textContent = '--';
                outKelvin.textContent = '--';
            }

            function validateAndConvert() {
                clearError();
                const inputValue = tempInput.value.trim();

                // 1. Check for empty input
                if (inputValue === '') {
                    showError('Please enter a temperature value.');
                    clearOutputs();
                    return;
                }

                // 2. Numeric validation (Allows negative values and decimals)
                const numericValue = Number(inputValue);
                if (isNaN(numericValue)) {
                    showError('Invalid input. Please enter a valid number.');
                    clearOutputs();
                    return;
                }

                // 3. Absolute Zero Violation Check
                const selectedUnit = unitSelect.value;
                if (numericValue < ABSOLUTE_ZERO[selectedUnit]) {
                    showError(`Temperature cannot be below Absolute Zero (${ABSOLUTE_ZERO[selectedUnit]}°${selectedUnit === 'K' ? '' : selectedUnit}).`);
                    clearOutputs();
                    return;
                }

                // 4. Perform conversions
                let c, f, k;

                switch (selectedUnit) {
                    case 'C':
                        c = numericValue;
                        f = (c * 9/5) + 32;
                        k = c + 273.15;
                        break;
                    case 'F':
                        f = numericValue;
                        c = (f - 32) * 5/9;
                        k = c + 273.15;
                        break;
                    case 'K':
                        k = numericValue;
                        c = k - 273.15;
                        f = (c * 9/5) + 32;
                        break;
                }

                // 5. Update UI with formatted values (rounded to 2 decimal places)
                outCelsius.textContent = `${parseFloat(c.toFixed(2))} °C`;
                outFahrenheit.textContent = `${parseFloat(f.toFixed(2))} °F`;
                outKelvin.textContent = `${parseFloat(k.toFixed(2))} K`;
            }

            // Trigger conversion on click
            convertBtn.addEventListener('click', validateAndConvert);

            // Optional: Real-time validation clearance as the user types
            tempInput.addEventListener('input', () => {
                if (tempInput.value.trim() === '' || !isNaN(Number(tempInput.value.trim()))) {
                    clearError();
                }
            });
        });
    </script>
</body>
</html>
